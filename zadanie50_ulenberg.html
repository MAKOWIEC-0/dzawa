 <!DOCTYPE html> 
<html> 
	<head>
		<meta charset="utf-8">
	</head>
	<body> 
		<div style="color:red;font-size:50px;"> 
		<script language="JavaScript"> 
			var suma_ule=0;
			
			for(i_ule=1;i_ule<=1000000;i_ule++)
			{
				suma_ule=suma_ule+1/i_ule;
			} 
			document.write("Suma = " + suma_ule.toFixed(2));
		</script> 
		</div>
	</body> 
</html>
