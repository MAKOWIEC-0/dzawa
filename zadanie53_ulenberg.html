<!DOCTYPE html> 
<html> 
	<head>
		<meta charset="utf-8">
		<title>Przykład użycia pętli</title>
	</head>
	<body> 
		<script language="JavaScript"> 
			var ile_razy_ule=parseFloat(prompt('Ile razy powtórzyć?',''));
			var inicjaly_ule=prompt('Podaj inicjaly:','')
			for (var i_ule=1; i_ule<=ile_razy_ule;i_ule++) 
			{ 
				for (var k_ule=1; k_ule<=i_ule;k_ule++) 
				{ 
					document.write("&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp");   
				} 
			document.write(i_ule+"_"+inicjaly_ule+"_"+i_ule+"<br>"); 
			}
		</script> 
	</body> 
</html>
