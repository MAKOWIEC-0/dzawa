<!DOCTYPE html> 
<html> 
	<head>
		<meta charset="utf-8">
	</head>
	<body> 
		<div style="color:darkslategray;font-size:48px;"> 
		<script language="JavaScript"> 
			var licznik_ule = 0;
			
			for(i_ule = 1; i_ule <= 100; i_ule++)
			{
				if(i_ule % 4 == 0 && i_ule % 6 == 0)
				{
					licznik_ule++;
				}
			} 
			document.write("Ilość dopasowań = " + licznik_ule);
		</script> 
		</div>
	</body> 
</html>
