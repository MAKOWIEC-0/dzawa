<!DOCTYPE html> 
<html> 
	<head>
		<meta charset="utf-8">
	</head>
	<body> 
		<div style="color:darkblue;font-size:46px;"> 
		<script language="JavaScript"> 
			var suma_ule = 0;
			
			for(i_ule = -5; i_ule <= 5; i_ule++)
			{
				if(i_ule < 0)
				{
					suma_ule = suma_ule + i_ule;
				}
			} 
			document.write("Suma ujemnych = " + suma_ule);
		</script> 
		</div>
	</body> 
</html>
