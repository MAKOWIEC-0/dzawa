<!DOCTYPE html> 
<html> 
	<head>
		<meta charset="utf-8">
	</head>
	<body> 
		<div style="color:crimson;font-size:42px;"> 
		<script language="JavaScript"> 
			var tekst_ule = prompt("Wpisz tekst do powtórzenia:", "JS");
			var ile_ule = parseInt(prompt("Ile razy powtórzyć?", "3"));
			
			for(i_ule = 1; i_ule <= ile_ule; i_ule++)
			{
				document.write(tekst_ule + "<br>");
			} 
		</script> 
		</div>
	</body> 
</html>
