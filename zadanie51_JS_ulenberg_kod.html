<html lang="pl">

<meta charset="UTF-8">

<body>
<div style=""color:red;font-size:50px;">
    <script language="JavaScript"> 
do {
    silnia_koniec=parseFloat(prompt("z czego silnia",""));
}
while(silnia_koniec<0);
if(silnia_koniec==0) {silnia_ule=1;}
else
{var silnia_ule=1;
    for(i=1;i<=silnia_koniec;i++){
        silnia_ule=silnia_ule*i;
    }
    }
document.write(silnia_koniec+"!="+silnia_ule); 

</script>
</div>
</body>
